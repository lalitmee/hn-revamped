<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <title>Offline — HN Revamped</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101114;
        color: #f4f4f5;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
      }
      a {
        color: #fb923c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Previously loaded Hacker News data may still be available. Reconnect and
        try again to load the latest stories.
      </p>
      <a href="/">Return to HN Revamped</a>
    </main>
  </body>
</html>
